name: Apply Index Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch to index.html
        run: python scripts/patch_index.py

      - name: Verify patched file size
        run: |
          SIZE=$(wc -c < index.html)
          echo "Patched index.html size: $SIZE bytes"
          if [ "$SIZE" != "9563670" ]; then
            echo "ERROR: Expected 9563670 bytes, got $SIZE"
            exit 1
          fi
          echo "Size verification passed!"

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "fix: current affairs date sorting with caDateToISO function"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up patch files
        run: |
          git rm -f scripts/patch_index.py .github/workflows/patch-index.yml || true
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git commit -m "chore: remove one-time patch files" || echo "Nothing to clean"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
