<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>গ্রাম পঞ্চায়েত পরীক্ষা - সম্পূর্ণ প্রস্তুতি</title>
<style>
:root{--p1:#667eea;--p2:#764ba2;--p3:#f093fb;--a1:#4facfe;--a2:#00f2fe;--s:#00b09b;--s2:#96c93d;--w:#fa709a;--w2:#fee140;--d:#0f0c29;--d2:#302b63;--d3:#24243e;--card:rgba(255,255,255,0.95);--text:#1a1a2e;--gray:#6c7293;--border:rgba(102,126,234,0.2);--shadow:0 8px 32px rgba(0,0,0,0.12);--radius:16px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}input,textarea{-webkit-user-select:text}button,.nav-btn,.option,.btn,.quiz-set-btn,.chapter-item,.cat-tab,.q-num{-webkit-user-select:none;user-select:none}
body{-webkit-tap-highlight-color:transparent;font-family:'Noto Sans Bengali','Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--d),var(--d2),var(--d3));background-attachment:fixed;color:var(--text);line-height:1.6;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 50%,rgba(120,119,198,0.15),transparent 50%),radial-gradient(circle at 80% 80%,rgba(255,119,198,0.1),transparent 50%),radial-gradient(circle at 40% 20%,rgba(0,200,255,0.08),transparent 50%);pointer-events:none;z-index:0}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(102,126,234,0.3)}50%{box-shadow:0 0 40px rgba(102,126,234,0.6)}}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(-5px)}}
.header{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:10px 16px;text-align:center;position:sticky;top:0;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.25);backdrop-filter:blur(10px)}
.header h1{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header p{display:none}
.header .icon{display:inline-block;animation:bounce 2s infinite}
.nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px 12px;background:rgba(15,12,41,0.9);backdrop-filter:blur(10px);position:sticky;top:46px;z-index:999;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav-btn{background:rgba(255,255,255,0.08);color:#ddd;border:1px solid rgba(255,255,255,0.15);padding:7px 12px;border-radius:10px;cursor:pointer;font-size:0.78rem;transition:all 0.3s;font-family:inherit;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nav-btn:hover{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;transform:translateY(-2px);box-shadow:0 4px 15px rgba(102,126,234,0.4)}
.nav-btn.active{background:linear-gradient(135deg,var(--w),var(--w2));color:#333;border-color:transparent;box-shadow:0 4px 15px rgba(250,112,154,0.5)}
.container{max-width:1100px;margin:20px auto;padding:0 15px;position:relative;z-index:1}
.page{display:none}
.page.active{display:block;animation:fadeInUp 0.4s ease}
.card{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow);backdrop-filter:blur(10px);border:1px solid var(--border);transition:transform 0.3s,box-shadow 0.3s}
.card:hover{box-shadow:0 12px 40px rgba(102,126,234,0.2)}
.card h2{color:var(--p2);margin-bottom:12px;font-size:1.25rem;position:relative;padding-bottom:8px}
.card h2::after{content:'';position:absolute;bottom:0;left:0;width:60px;height:3px;background:linear-gradient(90deg,var(--p1),var(--p3));border-radius:2px}
.card h3{color:var(--p1);margin:12px 0 8px;font-size:1.05rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:16px 0}
.stat-box{background:linear-gradient(135deg,rgba(102,126,234,0.08),rgba(118,75,162,0.08));border-radius:12px;padding:18px;text-align:center;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.stat-box::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--p1),var(--p3),transparent);animation:shimmer 3s infinite}
.stat-box:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(102,126,234,0.2)}
.stat-box .num{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-box .label{font-size:0.78rem;color:var(--gray);margin-top:4px}
.progress-bar{background:rgba(102,126,234,0.1);border-radius:12px;height:24px;overflow:hidden;margin:8px 0;position:relative}
.progress-fill{height:100%;border-radius:12px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.75rem;font-weight:700;position:relative;overflow:hidden}
.progress-fill::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shimmer 2s infinite}
.progress-fill.grad1{background:linear-gradient(90deg,var(--s),var(--s2))}
.progress-fill.grad2{background:linear-gradient(90deg,var(--a1),var(--a2))}
.progress-fill.grad3{background:linear-gradient(90deg,var(--w),var(--w2))}
.progress-fill.grad4{background:linear-gradient(90deg,var(--p1),var(--p3))}
.subject-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
.subject-card::before{content:'';position:absolute;left:0;top:0;width:5px;height:100%;background:linear-gradient(180deg,var(--p1),var(--p3))}
.subject-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(102,126,234,0.25);border-color:var(--p1)}
.subject-card h3{color:var(--p2);margin-bottom:4px;margin-left:8px}
.subject-card .meta{font-size:0.8rem;color:var(--gray);margin-left:8px}
.chapter-list{margin-top:12px;}
.chapter-item{background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all 0.3s;font-family:inherit;white-space:nowrap;flex-shrink:0}
.nav-btn:hover{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;transform:translateY(-2px);box-shadow:0 4px 15px rgba(102,126,234,0.4)}
