<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>গ্রাম পঞ্চায়েত পরীক্ষা - সম্পূর্ণ প্রস্তুতি</title>
<style>
:root{--p1:#667eea;--p2:#764ba2;--p3:#f093fb;--a1:#4facfe;--a2:#00f2fe;--s:#00b09b;--s2:#96c93d;--w:#fa709a;--w2:#fee140;--d:#0f0c29;--d2:#302b63;--d3:#24243e;--card:rgba(255,255,255,0.95);--text:#1a1a2e;--gray:#6c7293;--border:rgba(102,126,234,0.2);--shadow:0 8px 32px rgba(0,0,0,0.12);--radius:16px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}input,textarea{-webkit-user-select:text}button,.nav-btn,.option,.btn,.quiz-set-btn,.chapter-item,.cat-tab,.q-num{-webkit-user-select:none;user-select:none}
body{-webkit-tap-highlight-color:transparent;font-family:'Noto Sans Bengali','Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--d),var(--d2),var(--d3));background-attachment:fixed;color:var(--text);line-height:1.6;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 50%,rgba(120,119,198,0.15),transparent 50%),radial-gradient(circle at 80% 80%,rgba(255,119,198,0.1),transparent 50%),radial-gradient(circle at 40% 20%,rgba(0,200,255,0.08),transparent 50%);pointer-events:none;z-index:0}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-1000px 0}100%{background-position:1000px 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(102,126,234,0.3)}50%{box-shadow:0 0 40px rgba(102,126,234,0.6)}}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(-5px)}}
.header{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:10px 16px;text-align:center;position:sticky;top:0;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.25);backdrop-filter:blur(10px)}
.header h1{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header p{display:none}
.header .icon{display:inline-block;animation:bounce 2s infinite}
.nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px 12px;background:rgba(15,12,41,0.9);backdrop-filter:blur(10px);position:sticky;top:46px;z-index:999;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav-btn{background:rgba(255,255,255,0.08);color:#ddd;border:1px solid rgba(255,255,255,0.15);padding:7px 12px;border-radius:10px;cursor:pointer;font-size:0.78rem;transition:all 0.3s;font-family:inherit;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nav-btn:hover{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;transform:translateY(-2px);box-shadow:0 4px 15px rgba(102,126,234,0.4)}
.nav-btn.active{background:linear-gradient(135deg,var(--w),var(--w2));color:#333;border-color:transparent;box-shadow:0 4px 15px rgba(250,112,154,0.5)}
.container{max-width:1100px;margin:20px auto;padding:0 15px;position:relative;z-index:1}
.page{display:none}
.page.active{display:block;animation:fadeInUp 0.4s ease}
.card{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow);backdrop-filter:blur(10px);border:1px solid var(--border);transition:transform 0.3s,box-shadow 0.3s}
.card:hover{box-shadow:0 12px 40px rgba(102,126,234,0.2)}
.card h2{color:var(--p2);margin-bottom:12px;font-size:1.25rem;position:relative;padding-bottom:8px}
.card h2::after{content:'';position:absolute;bottom:0;left:0;width:60px;height:3px;background:linear-gradient(90deg,var(--p1),var(--p3));border-radius:2px}
.card h3{color:var(--p1);margin:12px 0 8px;font-size:1.05rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:16px 0}
.stat-box{background:linear-gradient(135deg,rgba(102,126,234,0.08),rgba(118,75,162,0.08));border-radius:12px;padding:18px;text-align:center;border:1px solid var(--border);transition:all 0.3s;position:relative;overflow:hidden}
.stat-box::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--p1),var(--p3),transparent);animation:shimmer 3s infinite}
.stat-box:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(102,126,234,0.2)}
.stat-box .num{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-box .label{font-size:0.78rem;color:var(--gray);margin-top:4px}
.progress-bar{background:rgba(102,126,234,0.1);border-radius:12px;height:24px;overflow:hidden;margin:8px 0;position:relative}
.progress-fill{height:100%;border-radius:12px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.75rem;font-weight:700;position:relative;overflow:hidden}
.progress-fill::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shimmer 2s infinite}
.progress-fill.grad1{background:linear-gradient(90deg,var(--s),var(--s2))}
.progress-fill.grad2{background:linear-gradient(90deg,var(--a1),var(--a2))}
.progress-fill.grad3{background:linear-gradient(90deg,var(--w),var(--w2))}
.progress-fill.grad4{background:linear-gradient(90deg,var(--p1),var(--p3))}
.subject-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
.subject-card::before{content:'';position:absolute;left:0;top:0;width:5px;height:100%;background:linear-gradient(180deg,var(--p1),var(--p3))}
.subject-card:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(102,126,234,0.25);border-color:var(--p1)}
.subject-card h3{color:var(--p2);margin-bottom:4px;margin-left:8px}
.subject-card .meta{font-size:0.8rem;color:var(--gray);margin-left:8px}
.chapter-list{margin-top:12px;}
.chapter-item{background:linear-gradient(135deg,rgba(102,126,234,0.04),rgba(118,75,162,0.04));border-radius:10px;padding:14px;margin-bottom:8px;border-left:3px solid var(--p1);cursor:pointer;transition:all 0.3s;display:flex;justify-content:space-between;align-items:center}
.chapter-item:hover{background:linear-gradient(135deg,rgba(102,126,234,0.1),rgba(118,75,162,0.1));border-left-color:var(--p3);transform:translateX(4px)}
.chapter-item.done{border-left-color:var(--s)}
.chapter-item .ch-title{font-weight:600;flex:1}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.7rem;font-weight:700}
.b-done{background:linear-gradient(135deg,var(--s),var(--s2));color:#fff}
.b-pending{background:linear-gradient(135deg,var(--w),var(--w2));color:#333}
.study-content{background:#fff;padding:24px;border-radius:12px;line-height:1.8;font-size:0.95rem;white-space:pre-wrap;word-wrap:break-word;max-height:70vh;overflow-y:auto;border:1px solid var(--border);}
.study-content::-webkit-scrollbar{width:8px}
.study-content::-webkit-scrollbar-track{background:rgba(102,126,234,0.05)}
.study-content::-webkit-scrollbar-thumb{background:var(--p1);border-radius:4px}
.btn{padding:10px 20px;border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-size:0.9rem;transition:all 0.3s;font-weight:600;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(0.96)}
.btn-back{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.btn-back:hover{box-shadow:0 4px 15px rgba(79,172,254,0.4);transform:translateY(-2px)}
.btn-read{background:linear-gradient(135deg,var(--s),var(--s2));color:#fff}
.btn-read:hover{box-shadow:0 4px 15px rgba(0,176,155,0.4);transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.btn-primary:hover{box-shadow:0 4px 15px rgba(102,126,234,0.4);transform:translateY(-2px)}
.btn-success{background:linear-gradient(135deg,var(--s),var(--s2));color:#fff}
.btn-success:hover{box-shadow:0 4px 15px rgba(0,176,155,0.4);transform:translateY(-2px)}
.btn-danger{background:linear-gradient(135deg,var(--w),var(--w2));color:#333}
.btn-danger:hover{box-shadow:0 4px 15px rgba(250,112,154,0.4);transform:translateY(-2px)}
.quiz-set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:16px 0}
.quiz-set-btn{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all 0.3s;font-family:inherit;position:relative;overflow:hidden}
.quiz-set-btn::before{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--p1),var(--p3))}
.quiz-set-btn:hover{border-color:var(--p1);transform:translateY(-4px);box-shadow:0 8px 25px rgba(102,126,234,0.2)}
.quiz-set-btn.done{border-color:var(--s)}
.quiz-set-btn.done::before{background:linear-gradient(90deg,var(--s),var(--s2))}
.quiz-set-btn .set-title{font-weight:700;color:var(--p2);font-size:0.88rem}
.quiz-set-btn .set-meta{font-size:0.72rem;color:var(--gray);margin-top:6px}
.question-box{border-radius:12px;padding:18px;margin-bottom:14px;border:1px solid var(--border)}.question-box.odd{background:linear-gradient(135deg,rgba(102,126,234,0.06),rgba(118,75,162,0.06))}.question-box.even{background:linear-gradient(135deg,rgba(0,176,155,0.06),rgba(150,201,61,0.06))}.question-separator{height:2px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:20px 0;border-radius:1px}
.question-text{font-weight:700;margin-bottom:12px;font-size:1.02rem;color:var(--d2)}
.option{display:block;padding:14px 18px;margin:8px 0;background:#fff;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all 0.25s;font-size:0.95rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.option:hover{border-color:var(--p1);transform:translateX(4px)}
.option.selected{border-color:var(--p1);background:rgba(102,126,234,0.08)}
.option.correct{border-color:var(--s);background:rgba(0,176,155,0.1)}
.option.wrong{border-color:var(--w);background:rgba(250,112,154,0.1)}
.option-label{font-weight:800;margin-right:10px;color:var(--p2)}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:10px}
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:14px 0}
.q-num{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:0.78rem;font-weight:700;border:2px solid var(--border);background:#fff;transition:all 0.2s}
.q-num:hover{border-color:var(--p1);transform:scale(1.1)}
.q-num.current{border-color:var(--p1);background:var(--p1);color:#fff}
.q-num.answered{border-color:var(--s);background:rgba(0,176,155,0.1)}
.q-num.correct{border-color:var(--s);background:var(--s);color:#fff}
.q-num.wrong{border-color:var(--w);background:var(--w);color:#fff}
.quiz-result{text-align:center;padding:30px;}
.quiz-result .score{font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,var(--p1),var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:20px 0}
.r-box{padding:16px;border-radius:12px;text-align:center;transition:transform 0.3s}
.r-box:hover{transform:scale(1.05)}
.r-box.correct{background:linear-gradient(135deg,rgba(0,176,155,0.1),rgba(150,201,61,0.1));color:var(--s)}
.r-box.wrong{background:linear-gradient(135deg,rgba(250,112,154,0.1),rgba(254,225,64,0.1));color:var(--w)}
.r-box.skipped{background:linear-gradient(135deg,rgba(102,126,234,0.08),rgba(118,75,162,0.08));color:var(--gray)}
.r-box .num{font-size:1.8rem;font-weight:800}
.r-box .lbl{font-size:0.75rem}
.month-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border-left:6px solid var(--p1);overflow:hidden;position:relative}
.month-card h3{color:var(--p2);margin-bottom:12px;font-size:1.15rem}
.day-target{background:linear-gradient(135deg,rgba(102,126,234,0.04),rgba(118,75,162,0.04));border-radius:10px;padding:10px 14px;margin-bottom:6px;font-size:0.85rem;display:flex;align-items:center;gap:10px;transition:all 0.3s;cursor:pointer;border:1px solid transparent}
.day-target:hover{border-color:var(--p1);transform:translateX(4px)}
.day-target.done{opacity:0.7}
.day-target.done .day-num{background:linear-gradient(135deg,var(--s),var(--s2))}
.day-target .day-num{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0}
.day-target .chk{width:20px;height:20px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.75rem;transition:all 0.3s}
.day-target.done .chk{background:linear-gradient(135deg,var(--s),var(--s2));border-color:transparent;color:#fff}
.day-target .day-content{flex:1}
.report-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:0.85rem}
.report-table th,.report-table td{padding:10px;text-align:left;border-bottom:1px solid var(--border)}
.report-table th{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-weight:600}
.report-table tr{transition:background 0.2s}
.report-table tr:hover{background:rgba(102,126,234,0.04)}
.tab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tab-btn{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all 0.3s;font-family:inherit;text-align:center;position:relative;overflow:hidden}
.tab-btn::before{content:'';position:absolute;top:0;left:0;width:100%;height:5px;background:linear-gradient(90deg,var(--p1),var(--p3))}
.tab-btn:hover{border-color:var(--p1);transform:translateY(-4px);box-shadow:0 8px 25px rgba(102,126,234,0.2)}
.tab-btn .icon{font-size:2.2rem;margin-bottom:8px}
.tab-btn .title{font-weight:700;color:var(--p2);font-size:0.88rem}
.tab-btn .count{font-size:0.72rem;color:var(--gray);margin-top:4px}
.info-box{background:linear-gradient(135deg,rgba(0,176,155,0.08),rgba(150,201,61,0.08));border:1px solid rgba(0,176,155,0.3);border-radius:10px;padding:14px;margin:10px 0;font-size:0.85rem;color:#333}
.search-box{width:100%;padding:12px 18px;border:2px solid var(--border);border-radius:12px;font-size:0.95rem;margin-bottom:14px;font-family:inherit;background:#fff;transition:all 0.3s}
.search-box:focus{border-color:var(--p1);outline:none;box-shadow:0 0 0 3px rgba(102,126,234,0.15)}
.cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cat-tab{background:rgba(102,126,234,0.08);border:1px solid var(--border);border-radius:10px;padding:8px 16px;cursor:pointer;font-size:0.82rem;font-family:inherit;transition:all 0.3s;color:var(--text)}
.cat-tab:hover{background:var(--p1);color:#fff}
.cat-tab.active{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
@media(max-width:600px){.header h1{font-size:0.95rem}.header p{font-size:0.72rem}.nav{top:42px}.nav-btn{font-size:0.72rem;padding:6px 10px}.container{padding:0 10px}.stat-grid{grid-template-columns:repeat(2,1fr)}.quiz-set-grid{grid-template-columns:repeat(2,1fr)}}
>.day-tabs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}.day-tab{background:rgba(102,126,234,0.04);border:2px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}.day-tab:hover{border-color:var(--p1);transform:translateY(-2px);box-shadow:0 4px 12px rgba(102,126,234,0.15)}.day-tab.done{background:linear-gradient(135deg,rgba(0,176,155,0.1),rgba(150,201,61,0.1));border-color:var(--s)}.day-tab-num{font-size:.75rem;color:var(--gray);font-weight:700;margin-bottom:4px}.day-tab.done .day-tab-num{color:var(--s)}.day-tab-chk{position:absolute;top:8px;right:8px;font-size:1rem;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(102,126,234,0.1)}.day-tab.done .day-tab-chk{background:var(--s);color:#fff}.day-tab-task{font-size:.78rem;line-height:1.4;color:var(--d2);margin-right:20px}
.day-tab.locked{opacity:.5;cursor:not-allowed;background:rgba(0,0,0,0.03)}
.day-tab.locked:hover{transform:none;box-shadow:none}
.today-target{background:linear-gradient(135deg,rgba(102,126,234,0.1),rgba(118,75,162,0.1));border:2px solid var(--p1);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.3s}
.today-target:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(102,126,234,0.2)}
.today-day{font-size:.8rem;color:var(--gray);font-weight:700;margin-bottom:4px}
.today-subject{font-size:.75rem;color:var(--p1);font-weight:600;margin-bottom:6px}
.today-title{font-size:1rem;font-weight:700;color:var(--d2);margin-bottom:8px}
.today-cta{font-size:.85rem;color:var(--p1);font-weight:600}

/* ===== AUTH SCREENS ===== */
#auth-overlay{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,var(--d),var(--d2),var(--d3));display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.auth-card{background:var(--card);border-radius:20px;padding:32px 24px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.4);border:1px solid var(--border)}
.auth-card .auth-logo{text-align:center;font-size:2.5rem;margin-bottom:8px}
.auth-card h2{text-align:center;color:var(--text);margin-bottom:6px;font-size:1.3rem}
.auth-card .auth-sub{text-align:center;color:var(--gray);font-size:.85rem;margin-bottom:24px}
.auth-field{margin-bottom:16px}
.auth-field label{display:block;font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:6px}
.auth-field input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-size:1rem;font-family:inherit;background:#fff;color:var(--text);box-sizing:border-box;transition:border-color .2s}
.auth-field input:focus{outline:none;border-color:var(--p1)}
.auth-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .3s;margin-bottom:12px}
.auth-btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.auth-btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(102,126,234,0.4)}
.auth-btn-secondary{background:rgba(255,255,255,0.1);color:var(--text);border:2px solid var(--border)}
.auth-btn-secondary:hover{background:rgba(255,255,255,0.2)}
.auth-link{text-align:center;color:var(--p1);font-size:.85rem;cursor:pointer;font-weight:600;margin-top:8px}
.auth-link:hover{text-decoration:underline}
.auth-error{background:rgba(250,112,154,0.15);color:#c0392b;padding:10px 16px;border-radius:10px;font-size:.85rem;margin-bottom:16px;display:none}
.auth-error.show{display:block}
.auth-info{background:rgba(0,176,155,0.1);color:#00b09b;padding:10px 16px;border-radius:10px;font-size:.85rem;margin-bottom:16px;display:none}
.auth-info.show{display:block}

.auth-loader{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-user-bar{position:fixed;top:0;right:0;z-index:1001;display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(135deg,rgba(102,126,234,0.9),rgba(118,75,162,0.9));backdrop-filter:blur(10px);border-bottom-left-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.auth-user-bar .user-email{color:#fff;font-size:.8rem;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-user-bar .logout-btn{background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:5px 12px;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.auth-user-bar .logout-btn:hover{background:rgba(250,112,154,0.3)}
.auth-sync-badge{position:fixed;top:48px;right:8px;z-index:1001;background:rgba(0,176,155,0.15);color:#00b09b;padding:3px 8px;border-radius:8px;font-size:.68rem;border:1px solid rgba(0,176,155,0.2);display:none}
.auth-sync-badge.show{display:block}
.auth-sync-badge.syncing{color:#f093fb;background:rgba(240,147,251,0.1)}


.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:44px !important}
.pwd-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--gray);padding:4px 6px;border-radius:6px;transition:all .2s;line-height:1}
.pwd-toggle:hover{color:var(--p1);background:rgba(102,126,234,0.1)}

</style>

</head>
<body>

  <div class="auth-card" id="auth-card">
    <div class="auth-logo">🏛️</div>

    <h2>স্বাগতম</h2>
    <p class="auth-sub">লগইন করতে আপনার ইমেইল ও পাসওয়ার্ড দিন</p>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-info" id="auth-info"></div>
    <div class="auth-field">
      <label>ইমেইল</label>
      <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>পাসওয়ার্ড</label>
      <div class="pwd-wrap">
        <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="pwd-toggle" onclick="togglePwd('auth-password')">👁</button>
      </div>
    </div>
    <button class="auth-btn auth-btn-primary" onclick="doLogin()" id="auth-submit-btn">লগইন করুন</button>
    <div class="auth-link" onclick="renderRegister()" style="margin-top:12px">নতুন একাউন্ট তৈরি করুন</div>

  </div>
  
  </div>
</div>
<div class="auth-user-bar" id="auth-user-bar" style="display:none">

  <button class="logout-btn" onclick="doLogout()">Logout</button>
</div>
<div class="auth-sync-badge" id="auth-sync-badge">✓ Synced</div>
<div class="header">
<h1><span class="icon">🏛️</span> গ্রাম পঞ্চায়েত পরীক্ষা</h1>
</div>
<div class="nav" id="nav"></div>

<div id="practice" class="page"></div>

<script>

// ===== LOCAL AUTH CONFIG =====
const USERS_KEY = 'panchayat_users';
const SESSION_KEY = 'panchayat_session';
let currentUser = null;

// Simple password hash
function hashPassword(pwd){let h=0;for(let i=0;i<pwd.length;i++){h=((h<<5)-h)+pwd.charCodeAt(i);h=h&h}return String(h)}

// ===== AUTH STATE =====
let authMode = 'login';

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  if (el) { el.textContent = msg; el.classList.add('show'); }
}
function hideAuthError() {
  const el = document.getElementById('auth-error');
  if (el) el.classList.remove('show');
}
function showAuthInfo(msg) {
  const el = document.getElementById('auth-info');
  if (el) { el.textContent = msg; el.classList.add('show'); }
}
function hideAuthInfo() {
  const el = document.getElementById('auth-info');
  if (el) el.classList.remove('show');
}

// Extract first name from email (e.g. "champakdak@gmail.com" -> "Champakdak")
function getFirstNameFromEmail(email) {
  if (!email) return '';
  var name = email.split('@')[0];
  name = name.split('.')[0].split('_')[0].split('-')[0].split('+')[0];
  if (name.length > 0) {
    name = name.charAt(0).toUpperCase() + name.slice(1);
  }
  return name;
}

function togglePwd(id) {
  var inp = document.getElementById(id);
  if (!inp) return;
  if (inp.type === 'password') {
    inp.type = 'text';
    event.target.textContent = '🙈';
  } else {
    inp.type = 'password';
    event.target.textContent = '👁';
  }
}

function setBtnLoading(loading, text) {
  const btn = document.getElementById('auth-submit-btn');
  if (!btn) return;
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<span class="auth-loader"></span> \u0985\u09aa\u09c7\u0995\u09cd\u09b7\u09be \u0995\u09b0\u09c1\u09a8...';
  } else {
    btn.disabled = false;
    btn.textContent = text;
  }
}

function renderLogin() {
  authMode = 'login';
  document.getElementById('auth-content').innerHTML = `
    <h2>\u09b8\u09cd\u09ac\u09be\u0997\u09a4\u09ae</h2>
    <p class="auth-sub">\u09b2\u0997\u0987\u09a8 \u0995\u09b0\u09a4\u09c7 \u0986\u09aa\u09a8\u09be\u09b0 \u0987\u09ae\u09c7\u0987\u09b2 \u0993 \u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 \u09a6\u09bf\u09a8</p>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-info" id="auth-info"></div>
    <div class="auth-field">
      <label>\u0987\u09ae\u09c7\u0987\u09b2</label>
      <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>\u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1</label>
      <div class="pwd-wrap">
        <input type="password" id="auth-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" autocomplete="current-password">
        <button type="button" class="pwd-toggle" onclick="togglePwd('auth-password')">👁</button>
      </div>
    </div>
    <button class="auth-btn auth-btn-primary" onclick="doLogin()" id="auth-submit-btn">\u09b2\u0997\u0987\u09a8 \u0995\u09b0\u09c1\u09a8</button>
    <div class="auth-link" onclick="renderRegister()" style="margin-top:12px">\u09a8\u09a4\u09c1\u09a8 \u098f\u0995\u09be\u0989\u09a8\u09cd\u099f \u09a4\u09c8\u09b0\u09bf \u0995\u09b0\u09c1\u09a8</div>
    <div class="auth-link" onclick="renderForgot()" style="margin-top:4px">\u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 \u09ad\u09c1\u09b2\u09c7 \u0997\u09c7\u099b\u09c7\u09a8?</div>
  `;
}

function renderRegister() {
  authMode = 'register';
  document.getElementById('auth-content').innerHTML = `
    <h2>\u09a8\u09a4\u09c1\u09a8 \u098f\u0995\u09be\u0989\u09a8\u09cd\u099f</h2>
    <p class="auth-sub">\u0986\u09aa\u09a8\u09be\u09b0 \u09a4\u09a5\u09cd\u09af \u09a6\u09bf\u09a8\u0964 \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u098f\u0995\u09be\u0989\u09a8\u09cd\u099f \u09a4\u09c8\u09b0\u09bf \u09b9\u09ac\u09c7\u0964</p>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-info" id="auth-info"></div>
    <div class="auth-field">
      <label>\u0987\u09ae\u09c7\u0987\u09b2</label>
      <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>\u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 (\u0995\u09ae\u09aa\u0995\u09cd\u09b7\u09c7 \u09eb \u0985\u0995\u09cd\u09b7\u09b0)</label>
      <div class="pwd-wrap">
        <input type="password" id="auth-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" autocomplete="new-password">
        <button type="button" class="pwd-toggle" onclick="togglePwd('auth-password')">👁</button>
      </div>
    </div>
    <div class="auth-field">
      <label>\u09a8\u09bf\u09b0\u09be\u09aa\u09a4\u09cd\u09a4\u09be \u09aa\u09cd\u09b0\u09b6\u09cd\u09a8</label>
      <select id="auth-security-question" style="width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-size:1rem;font-family:inherit;background:#fff;color:var(--text);box-sizing:border-box">
        <option value="\u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09bf\u09af\u09bc \u0996\u09be\u09ac\u09be\u09b0 \u0995\u09c0?">\u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09bf\u09af\u09bc \u0996\u09be\u09ac\u09be\u09b0 \u0995\u09c0?</option>
        <option value="\u0986\u09aa\u09a8\u09be\u09b0 \u099c\u09a8\u09cd\u09ae\u09b8\u09cd\u09a5\u09be\u09a8\u09c7\u09b0 \u09a8\u09be\u09ae \u0995\u09c0?">\u0986\u09aa\u09a8\u09be\u09b0 \u099c\u09a8\u09cd\u09ae\u09b8\u09cd\u09a5\u09be\u09a8\u09c7\u09b0 \u09a8\u09be\u09ae \u0995\u09c0?</option>
        <option value="\u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09bf\u09af\u09bc \u09b0\u0999 \u0995\u09c0?">\u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09bf\u09af\u09bc \u09b0\u0999 \u0995\u09c0?</option>
        <option value="\u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09a5\u09ae \u09b8\u09cd\u0995\u09c1\u09b2\u09c7\u09b0 \u09a8\u09be\u09ae \u0995\u09c0?">\u0986\u09aa\u09a8\u09be\u09b0 \u09aa\u09cd\u09b0\u09a5\u09ae \u09b8\u09cd\u0995\u09c1\u09b2\u09c7\u09b0 \u09a8\u09be\u09ae \u0995\u09c0?</option>
      </select>
    </div>
    <div class="auth-field">
      <label>\u09a8\u09bf\u09b0\u09be\u09aa\u09a4\u09cd\u09a4\u09be \u0989\u09a4\u09cd\u09a4\u09b0</label>
      <input type="text" id="auth-security-answer" placeholder="\u0986\u09aa\u09a8\u09be\u09b0 \u0989\u09a4\u09cd\u09a4\u09b0">
    </div>
    <button class="auth-btn auth-btn-primary" onclick="doRegister()" id="auth-submit-btn">\u098f\u0995\u09be\u0989\u09a8\u09cd\u099f \u09a4\u09c8\u09b0\u09bf \u0995\u09b0\u09c1\u09a8</button>
    <div class="auth-link" onclick="renderLogin()">\u0987\u09a4\u09ae\u09a7\u09cd\u09af\u09c7 \u098f\u0995\u09be\u0989\u09a8\u09cd\u099f \u0986\u099b\u09c7? \u09b2\u0997\u0987\u09a8 \u0995\u09b0\u09c1\u09a8</div>
  `;
}

function renderForgot() {
  authMode = 'forgot';
  document.getElementById('auth-content').innerHTML = `
    <h2>\u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 \u09b0\u09bf\u0995\u09ad\u09be\u09b0\u09bf</h2>
    <p class="auth-sub">\u0986\u09aa\u09a8\u09be\u09b0 \u0987\u09ae\u09c7\u0987\u09b2 \u09a6\u09bf\u09a8\u0964</p>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-info" id="auth-info"></div>
    <div class="auth-field">
      <label>\u0987\u09ae\u09c7\u0987\u09b2</label>
      <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <button class="auth-btn auth-btn-primary" onclick="doForgotCheckEmail()" id="auth-submit-btn">\u09aa\u09b0\u09ac\u09b0\u09cd\u09a4\u09c0</button>
    <div class="auth-link" onclick="renderLogin()">\u09ab\u09bf\u09b0\u09c7 \u09af\u09be\u09a8 \u09b2\u0997\u0987\u09a8\u09c7</div>
  `;
}

function renderForgotSecurity(email) {
  authMode = 'forgot-security';
  var users = {};
  try { users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch(e) {}
  var user = users[email];
  var sq = user ? user.security_question : '';
  document.getElementById('auth-content').innerHTML = `
    <h2>\u09a8\u09bf\u09b0\u09be\u09aa\u09a4\u09cd\u09a4\u09be \u09aa\u09cd\u09b0\u09b6\u09cd\u09a8</h2>
    <p class="auth-sub">\u09a8\u09bf\u099a\u09c7\u09b0 \u09aa\u09cd\u09b0\u09b6\u09cd\u09a8\u09c7\u09b0 \u0989\u09a4\u09cd\u09a4\u09b0 \u09a6\u09bf\u09a8\u0964</p>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-info" id="auth-info"></div>
    <div class="auth-field">
      <label>\u09aa\u09cd\u09b0\u09b6\u09cd\u09a8</label>
      <input type="text" value="${esc(sq)}" readonly style="background:rgba(255,255,255,0.5)">
    </div>
    <div class="auth-field">
      <label>\u0989\u09a4\u09cd\u09a4\u09b0</label>
      <input type="text" id="auth-security-answer" placeholder="\u0986\u09aa\u09a8\u09be\u09b0 \u0989\u09a4\u09cd\u09a4\u09b0">
    </div>
    <button class="auth-btn auth-btn-primary" onclick="doForgotVerifyAnswer('${esc(email)}')" id="auth-submit-btn">\u0989\u09a4\u09cd\u09a4\u09b0 \u09af\u09be\u099a\u09be\u0987 \u0995\u09b0\u09c1\u09a8</button>
    <div class="auth-link" onclick="renderForgot()">\u09ab\u09bf\u09b0\u09c7 \u09af\u09be\u09a8</div>
  `;
}

function renderForgotReset(email) {
  authMode = 'forgot-reset';
  document.getElementById('auth-content').innerHTML = `
    <h2>\u09a8\u09a4\u09c1\u09a8 \u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1</h2>
    <p class="auth-sub">\u09a8\u09a4\u09c1\u09a8 \u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 \u09a6\u09bf\u09a8\u0964</p>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-info" id="auth-info"></div>
    <div class="auth-field">
      <label>\u09a8\u09a4\u09c1\u09a8 \u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 (\u0995\u09ae\u09aa\u0995\u09cd\u09b7\u09c7 \u09eb \u0985\u0995\u09cd\u09b7\u09b0)</label>
      <div class="pwd-wrap">
        <input type="password" id="auth-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" autocomplete="new-password">
        <button type="button" class="pwd-toggle" onclick="togglePwd('auth-password')">👁</button>
      </div>
    </div>
    <button class="auth-btn auth-btn-primary" onclick="doForgotResetPassword('${esc(email)}')" id="auth-submit-btn">\u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 \u0986\u09aa\u09a1\u09c7\u099f \u0995\u09b0\u09c1\u09a8</button>
    <div class="auth-link" onclick="renderLogin()">\u09ab\u09bf\u09b0\u09c7 \u09af\u09be\u09a8 \u09b2\u0997\u0987\u09a8\u09c7</div>
  `;
}

// ===== AUTH ACTIONS =====
function doLogin() {
  hideAuthError(); hideAuthInfo();
  const email = document.getElementById('auth-email')?.value.trim();
  const password = document.getElementById('auth-password')?.value;
  if (!email || !password) { showAuthError('\u0987\u09ae\u09c7\u0987\u09b2 \u0993 \u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 \u09a6\u09bf\u09a8\u0964'); return; }
  var users = {};
  try { users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch(e) {}
  var user = users[email];
  if (!user) { showAuthError('\u098f\u0987 \u0987\u09ae\u09c7\u0987\u09b2\u09c7 \u0995\u09cb\u09a8\u09cb \u098f\u0995\u09be\u0989\u09a8\u09cd\u099f \u09a8\u09c7\u0987\u0964'); return; }
  if (user.password_hash !== hashPassword(password)) {
    showAuthError('\u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 \u09b8\u09a0\u09bf\u0995 \u09a8\u09af\u09bc\u0964'); return;
  }
  localStorage.setItem(SESSION_KEY, JSON.stringify({email: email, timestamp: Date.now()}));
  currentUser = {email: email};
  onAuthSuccess();
}

function doRegister() {
  hideAuthError(); hideAuthInfo();
  const email = document.getElementById('auth-email')?.value.trim();
  const password = document.getElementById('auth-password')?.value;
  const securityQuestion = document.getElementById('auth-security-question')?.value;
  const securityAnswer = document.getElementById('auth-security-answer')?.value.trim();
  if (!email || !password) { showAuthError('\u0987\u09ae\u09c7\u0987\u09b2 \u0993 \u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 \u09a6\u09bf\u09a8\u0964'); return; }
  if (password.length < 6) { showAuthError('\u09aa\u09be\u09b8\u0993\u09af\u09bc\u09be\u09b0\u09cd\u09a1 \u0995\u09ae\u09aa\u0995\u09cd\u09b7\u09c7 \u09eb \u0985\u0995\u09cd\u09b7\u09b0\u09c7\u09b0 \u09b9\u09a4\u09c7 \u09b9\u09ac\u09c7\u0964'); return; }
  if (!securityAnswer) { showAuthError('\u09a8\u09bf\u09b0\u09be\u09aa\u09a4\u09cd\u09a4\u09be \u0989\u09a4\u09cd\u09a4\u09b0 \u09a6\u09bf\u09a8\u0964'); return; }
  var users = {};
  try { users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch(e) {}
  if (users[email]) { showAuthError('\u098f\u0987 \u0987\u09ae\u09c7\u0987\u09b2\u09c7 \u0987\u09a4\u09ae\u09a7\u09cd\u09af\u09c7 \u098f\u0995\u09be\u0989\u09a8\u09cd\u099f \u0986\u099b\u09c7\u0964'); return; }
  users[email] = {
    password_hash: hashPassword(password),
    security_question: securityQuestion,
    security_answer: securityAnswer.toLowerCase()
  };
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
  localStorage.setItem(SESSION_KEY, JSON.stringify({email: email, timestamp: Date.now()}));
  currentUser = {email: email};
  onAuthSuccess();
}

function doForgotCheckEmail() {
  hideAuthError(); hideAuthInfo();
  const email = document.getElementById('auth-email')?.value.trim();

  try { users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch(e) {}

  users[email].password_hash = hashPassword(password);

// ===== AUTH SUCCESS =====
function onAuthSuccess() {
  // Clear local data from previous user
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  try { localStorage.removeItem(HISTORY_KEY); } catch(e) {}
  // Load user-specific data from localStorage
  if (currentUser && currentUser.email) {
    var dataKey = 'panchayat_data_' + btoa(currentUser.email);
    var savedProgress = null;
    var savedHistory = null;
    try { savedProgress = JSON.parse(localStorage.getItem(dataKey + '_progress')); } catch(e) {}
    try { savedHistory = JSON.parse(localStorage.getItem(dataKey + '_history')); } catch(e) {}
    progress = savedProgress || loadProgress();
    history = savedHistory || [];
    // Save to global key for backward compat
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch(e) {}
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e) {}
  } else {
    progress = loadProgress();
    history = [];
  }
  // Hide auth overlay, show app
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('auth-user-bar').style.display = 'flex';
  // Load data if not already loaded, then render dashboard
  if(!DATA_LOADED){
    loadData().then(function(){
      buildNav();
      showPage('dashboard');
    });
  } else {
    buildNav();
    showPage('dashboard');
  }
  document.getElementById('auth-user-email').textContent = '\u09b8\u09cd\u09ac\u09be\u0997\u09a4\u09ae\u09cd, ' + getFirstNameFromEmail(currentUser.email);
  // Build nav (clears old one first)
  buildNav();
  showPage('dashboard');
}

// ===== CHECK AUTH ON LOAD =====
function checkAuthState() {
  var session = null;
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); } catch(e) {}
  if (session && session.email) {
    var users = {};
    try { users = JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch(e) {}
    if (users[session.email]) {
      currentUser = {email: session.email};
      onAuthSuccess();
      return;
    }
  }
  // No valid session - show login form
  renderLogin();
}

// ===== CONFETTI / VICTORY ANIMATION =====
let confettiCanvas=null,confettiCtx=null,confettiParticles=[],confettiRAF=null,confettiStart=0;
const CONFETTI_COLORS=['#667eea','#764ba2','#f093fb','#4facfe','#00f2fe','#00b09b','#96c93d','#fa709a','#fee140','#ffd700','#ff6b6b'];
function showConfetti(){
  if(confettiRAF){cancelAnimationFrame(confettiRAF);confettiRAF=null}
  if(!confettiCanvas){
    confettiCanvas=document.createElement('canvas');
    confettiCanvas.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999';
    document.body.appendChild(confettiCanvas);
    confettiCtx=confettiCanvas.getContext('2d');
  }
  const dpr=window.devicePixelRatio||1;
  confettiCanvas.width=window.innerWidth*dpr;
  confettiCanvas.height=window.innerHeight*dpr;
  confettiCtx.setTransform(1,0,0,1,0,0);
  confettiCtx.scale(dpr,dpr);
  confettiCanvas.style.display='block';
  confettiParticles=[];
  const W=window.innerWidth,H=window.innerHeight;
  const count=Math.min(100,Math.floor(W/6));
  for(let i=0;i<count;i++){
    confettiParticles.push({
      x:Math.random()*W,
      y:-20-Math.random()*H*0.2,
      vx:(Math.random()-0.5)*5,
      vy:3+Math.random()*5,
      size:6+Math.random()*8,
      color:CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-0.5)*0.3,
      shape:Math.random()<0.5?'rect':'circle',
      life:1
    });
  }
  confettiStart=Date.now();
  animateConfetti();
}
function animateConfetti(){
  if(!confettiCtx)return;
  const W=window.innerWidth,H=window.innerHeight;
  confettiCtx.clearRect(0,0,W,H);
  const elapsed=Date.now()-confettiStart;
  let alive=0;
  confettiParticles.forEach(p=>{
    if(elapsed>500)p.life-=0.04;
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.08;
    p.rot+=p.vr;
    if(p.y>H+30)p.y=-20;
    if(p.life>0){
      alive++;
      confettiCtx.save();
      confettiCtx.translate(p.x,p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.globalAlpha=Math.max(0,p.life);
      confettiCtx.fillStyle=p.color;
      if(p.shape==='rect'){
        confettiCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      }else{
        confettiCtx.beginPath();
        confettiCtx.arc(0,0,p.size/2,0,Math.PI*2);
        confettiCtx.fill();
      }
      confettiCtx.restore();
    }
  });
  if(alive>0){
    confettiRAF=requestAnimationFrame(animateConfetti);
  }else{
    confettiCanvas.style.display='none';
    confettiRAF=null;
  }
}
window.addEventListener('resize',function(){
  if(confettiCanvas&&confettiCanvas.style.display!=='none'){
    const dpr=window.devicePixelRatio||1;
    confettiCanvas.width=window.innerWidth*dpr;
    confettiCanvas.height=window.innerHeight*dpr;
    confettiCtx.setTransform(1,0,0,1,0,0);
    confettiCtx.scale(dpr,dpr);
  }
});

function submitQuiz(force){
try{
const s=quiz.set,t=s.questions.length,a=Object.keys(quiz.answers).length;
if(a<t&&!confirm(a+' টি প্রশ্ন বাকি আছে। '+(t-a)+' টি উত্তর দেওয়া হয়নি। তবুও সাবমিট করবেন?'))return;
const c=Object.keys(quiz.answers).filter(k=>quiz.answers[k]===quiz.set.questions[parseInt(k)].answer).length;
const p=t>0?Math.round((c/t)*100):0;
quiz.showResults=true;
quiz.result={correct:c,total:t,percentage:p,date:new Date().toISOString(),name:quiz.set.title||quiz.set.type};
if(quiz.pageId==='mocktest'){
progress.mock_tests=progress.mock_tests||[];
progress.mock_tests.push(quiz.result);
saveProgress(progress);
}else if(quiz.pageId==='practice'){
progress.practice_done=progress.practice_done||{};
progress.practice_done[quiz.setId||quiz.set.title]=quiz.result;
saveProgress(progress);
}
showConfetti();
let rh=`
<div class="card"><div class="quiz-result"><div class="score">${c}/${t}</div><div style="color:var(--gray);font-size:1.1rem">${p}%</div></div>
<div class="result-grid"><div class="r-box correct"><div class="r-num">${c}</div><div class="r-label">সঠিক</div></div>
<div class="r-box wrong"><div class="r-num">${t-c}</div><div class="r-label">ভুল</div></div>
<div class="r-box total"><div class="r-num">${t}</div><div class="r-label">মোট</div></div></div>
${p>=80?'<div class="info-box" style="background:rgba(0,176,155,0.1);color:#00b09b;text-align:center;padding:12px;border-radius:10px;margin-top:12px">🎉 চমৎকার! আপনি ৮০% এর বেশি পেয়েছেন!</div>':''}
<div style="display:flex;gap:8px;margin-top:16px">
<button class="btn" style="flex:1" onclick="backFromQuiz()">ফিরে যান</button>
<button class="btn btn-primary" style="flex:1" onclick="reviewQuiz()">উত্তর পর্যালোচনা</button>
</div></div>`;
document.getElementById(quiz.pageId).innerHTML=rh;
}catch(err){console.error('Submit error:',err);alert('সাবমিট করতে সমস্যা: '+err.message)}
}

function reviewQuiz(){quiz.showResults=true;quiz.currentQ=0;renderQuiz(quiz.pageId)}
function backFromQuiz(){const pid=quiz?quiz.pageId:null;quiz=null;if(pid){const loaders={practice:loadPractice,mocktest:loadMockTest,'subject-quiz':loadSubjectQuiz,pyq:loadPYQ};if(loaders[pid])loaders[pid]()}else{const loaders={practice:loadPractice,mocktest:loadMockTest,'subject-quiz':loadSubjectQuiz,pyq:loadPYQ};const active=document.querySelector('.page.active')?.id;if(loaders[active])loaders[active]()}}
// REPORT
function loadReport(){
let sh='<table class="report-table"><tr><th>বিষয়</th><th>অধ্যায়</th><th>সম্পন্ন</th><th>%</th></tr>';
STUDY_DATA.forEach(v=>{const t=v.chapters.length;let r=0;v.chapters.forEach(c=>{if(progress.chapters_read[v.volume+'|'+c.title])r++});const p=t>0?Math.round((r/t)*100):0;sh+=`<tr><td>${esc(v.subject)}</td><td>${t}</td><td>${r}</td><td><strong>${p}%</strong></td></tr>`});
sh+='</table>';
let th='<table class="report-table"><tr><th>তারিখ</th><th>টেস্ট</th><th>স্কোর</th><th>%</th></tr>';
const all=[];(progress.mock_tests||[]).forEach(t=>all.push(t));Object.values(progress.practice_done||{}).forEach(t=>all.push(t));
all.sort((a,b)=>new Date(b.date)-new Date(a.date));
if(all.length===0)th+='<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--gray)">এখনও কোনো টেস্ট দেওয়া হয়নি</td></tr>';
all.forEach(t=>{th+=`<tr><td>${new Date(t.date).toLocaleDateString('bn-BD')}</td><td>${esc(t.name||'')}</td><td>${t.correct||0}/${t.total||0}</td><td><strong>${t.percentage||0}%</strong></td></tr>`});
th+='</table>';
// Day targets
let dp=0,dt=0;for(let m=1;m<=6;m++){for(let d=1;d<=30;d++){const k='m'+m+'_d'+d;dt++;if(progress.day_targets[k])dp++}}
const pp=dt>0?Math.round((dp/dt)*100):0;
let html=`<div class="card"><h2>📊 প্রগ্রেস রিপোর্ট</h2><div class="info-box">🔒 আপনার সমস্ত প্রগ্রেস নিরাপদে সেভ করা আছে। রিফ্রেশ বা বন্ধ করলেও কিছু মুছবে না।</div><h3>📅 প্ল্যান প্রগ্রেস</h3><div class="progress-bar" style="height:20px"><div class="progress-fill grad4" style="width:${pp}%">${pp}% (${dp}/${dt} দিন)</div></div></div><div class="card"><h3>📖 পড়াশোনার অগ্রগতি</h3>${sh}</div><div class="card"><h3>📝 টেস্ট ইতিহাস (${all.length})</h3>${th}</div>`;
html+=`<div class="card"><h3>💾 ব্যাকআপ</h3><p>আপনার প্রগ্রেস ব্যাকআপ করুন:</p><button class="btn btn-primary" onclick="exportData()" style="margin-top:8px">📥 ব্যাকআপ ডাউনলোড</button><button class="btn btn-success" onclick="document.getElementById('imp').click()" style="margin-top:8px;margin-left:8px">📤 রিস্টোর করুন</button><input type="file" id="imp" style="display:none" accept=".json" onchange="importData(event)"></div>`;
document.getElementById('report').innerHTML=html;
}
function exportData(){const d={progress,history,exportDate:new Date().toISOString()};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='panchayat_backup_'+new Date().toISOString().split('T')[0]+'.json';a.click();URL.revokeObjectURL(u)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{const d=JSON.parse(ev.target.result);if(d.progress){Object.keys(d.progress.chapters_read||{}).forEach(k=>{if(!progress.chapters_read[k])progress.chapters_read[k]=d.progress.chapters_read[k]});Object.keys(d.progress.practice_done||{}).forEach(k=>{if(!progress.practice_done[k])progress.practice_done[k]=d.progress.practice_done[k]});if(d.progress.mock_tests)progress.mock_tests=[...(progress.mock_tests||[]),...d.progress.mock_tests];Object.keys(d.progress.day_targets||{}).forEach(k=>{if(!progress.day_targets[k])progress.day_targets[k]=d.progress.day_targets[k]});saveProgress(progress)}if(d.history){history=[...history,...d.history];saveHistory(history)}alert('ব্যাকআপ সফলভাবে রিস্টোর করা হয়েছে!');loadReport()}catch(err){alert('ত্রুটি: '+err.message)}};r.readAsText(f)}
// INIT
window.addEventListener('beforeunload',function(){});
// Run auth check and data loading in parallel
checkAuthState();
loadData();
</script>
